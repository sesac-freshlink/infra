# 클러스터 켜고 끄기 (aws-리소스-계획.md 6-5). Terraform으로 envs/<env>/cluster를 만들고 지운다. env는 dev(기본)·prod.
# RDS·SSM 접속용 인스턴스·노드 수는 EventBridge Scheduler(envs/<env>/persistent)가 맡는다.
# 아래 GitHub 예약은 dev만 돈다. prod는 평소 꺼 두고, 사람이 Run workflow에서 env=prod로 켜고 끈다(할 일 14).
# prod 밤 삭제는 EventBridge(envs/prod/persistent)가 prod-cluster.yml을 부르고, 그 워크플로가 이 파일을 env=prod로 부른다.
# 예약 작업은 UTC다. 한국 시각 - 9시간. 몇 분 늦게 돌 수 있다.
# GitHub는 사람이 몰리는 정각(특히 UTC 00:00)에 예약 실행을 늦추거나 아예 건너뛴다(2026-10-20 화 09:00 NAT 생성이 안 돎).
# 그래서 정각을 피하고, 꼭 돌아야 하는 NAT 생성·클러스터 삭제는 뒤에 한 번 더 돈다. 두 번 돌아도 바뀌는 것이 없다.
name: dev-cluster
run-name: "${{ inputs.env || 'dev' }} ${{ inputs.action || 'schedule' }}"

on:
  schedule:
    - cron: "40 23 * * 0"  # 월 08:40 클러스터 생성 (UTC 일요일 23:40)
    - cron: "50 23 * * 1-4" # 화·수·목·금 08:50 NAT 생성 (UTC 전날 23:50)
    - cron: "25 0 * * 1-5"  # 월·화·수·목·금 09:25 NAT 생성 한 번 더 (이미 있으면 그대로)
    - cron: "10 12 * * 1-4" # 월·화·수·목 21:10 NAT 삭제
    - cron: "5 12 * * 5"    # 금 21:05 클러스터 삭제
    - cron: "35 13 * * 5"   # 금 22:35 클러스터 삭제 한 번 더 (이미 없으면 그대로)
    - cron: "5 14 * * *"    # 매일 23:05 NAT가 남아 있으면 삭제
  workflow_dispatch:
    inputs:
      action:
        description: "create = 클러스터 만들기(NAT·노드 2대 포함), destroy = 클러스터 지우기, nat-on / nat-off = NAT만, api-origin = CloudFront /api를 지금 ALB로 맞추기만, unlock = 끊긴 작업이 남긴 state 잠금 풀기"
        type: choice
        required: true
        options: [create, destroy, nat-on, nat-off, api-origin, unlock]
      env:
        description: "환경. prod는 평소 꺼 두고 릴리스 확인·리허설·시연 날만 create, 끝나면 destroy"
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      lock_id:
        description: "unlock일 때만: 실패한 작업 로그 'Lock Info'의 ID"
        type: string
        required: false
  # prod-cluster.yml(EventBridge가 부르는 prod 입구)이 env=prod로 부른다
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      env:
        type: string
        required: true
      lock_id:
        type: string
        required: false

permissions:
  id-token: write # GitHub OIDC로 AWS Role을 맡는다
  contents: read

# 예약 실행에는 inputs가 없어서 dev가 된다.
env:
  AWS_REGION: ap-northeast-2
  TARGET_ENV: ${{ inputs.env || 'dev' }}
  CLUSTER: freshlink-${{ inputs.env || 'dev' }}-eks
  NODEGROUP: freshlink-${{ inputs.env || 'dev' }}-nodes
  ROOT: envs/${{ inputs.env || 'dev' }}/cluster
  STATE_KEY: ${{ inputs.env || 'dev' }}/cluster/terraform.tfstate # versions.tf backend key. 잠금 파일은 뒤에 .tflock이 붙는다

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 두 작업이 같은 state를 동시에 건드리지 않게 환경마다 한 줄로 세운다(dev와 prod는 따로 돈다).
    # 작업 단위로 둔다: prod-cluster.yml이 부를 때도 같은 줄에 선다.
    concurrency:
      group: ${{ inputs.env || 'dev' }}-cluster
      cancel-in-progress: false
    steps:
      - name: 할 일 고르기
        id: what
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.action }}
        run: |
          case "${SCHEDULE}" in
            "40 23 * * 0")  action=create ;;
            "50 23 * * 1-4") action=nat-on ;;
            "25 0 * * 1-5")  action=nat-on ;;
            "10 12 * * 1-4") action=nat-off ;;
            "5 12 * * 5")    action=destroy ;;
            "35 13 * * 5")   action=destroy ;;
            "5 14 * * *")    action=nat-off ;;
            *)              action="${INPUT}" ;;
          esac
          [ -n "${action}" ] || { echo "할 일을 정하지 못했다"; exit 1; }
          case "${TARGET_ENV}" in
            dev|prod) ;;
            *) echo "::error::env는 dev 또는 prod다: ${TARGET_ENV}"; exit 1 ;;
          esac

          # GitHub는 예약 실행을 몇 시간씩 늦게 돌리기도 한다(2026-10-19 21:10 NAT 삭제가 다음 날 03:41에 돎).
          # 늦게 온 예약이 낮에 NAT를 지우거나 밤에 NAT를 켜지 않게, 예약 실행은 한국 시각이 맞을 때만 한다.
          # 수동 버튼(workflow_dispatch)은 언제든 그대로 돈다.
          if [ -n "${SCHEDULE}" ]; then
            dow=$(TZ=Asia/Seoul date +%u)    # 1=월 … 7=일
            hour=$(TZ=Asia/Seoul date +%-H)
            ok=false
            case "${action}" in
              create)  [ "$dow" = 1 ] && [ "$hour" -ge 8 ] && [ "$hour" -lt 20 ] && ok=true ;;              # 월 08~20시
              nat-on)  [ "$dow" -le 5 ] && [ "$hour" -ge 8 ] && [ "$hour" -lt 20 ] && ok=true ;;            # 평일 08~20시
              nat-off) { [ "$hour" -ge 21 ] || [ "$hour" -lt 8 ]; } && ok=true ;;                            # 21시~다음 날 08시
              destroy) { { [ "$dow" = 5 ] && [ "$hour" -ge 21 ]; } || [ "$dow" -ge 6 ]; } && ok=true ;;       # 금 21시~일요일
            esac
            if [ "$ok" != true ]; then
              echo "예약 ${action}이 너무 늦게 와서($(TZ=Asia/Seoul date '+%a %H:%M') 한국 시각) 건너뛴다" | tee -a "$GITHUB_STEP_SUMMARY"
              action=skip
            fi
          fi
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "### ${TARGET_ENV} 클러스터: ${action}" >> "$GITHUB_STEP_SUMMARY"

      # 환경마다 Role이 따로다(freshlink-<env>-cluster-actions, 각 환경 persistent 출력 cluster_actions_role_arn).
      # prod 비밀이 비어 있을 때 dev Role로 넘어가지 않게 여기서 멈춘다.
      - name: Role 고르기
        id: role
        if: steps.what.outputs.action != 'skip'
        env:
          DEV_ROLE: ${{ secrets.AWS_DEV_CLUSTER_ROLE_ARN }}
          PROD_ROLE: ${{ secrets.AWS_PROD_CLUSTER_ROLE_ARN }}
        run: |
          if [ "$TARGET_ENV" = prod ]; then role="$PROD_ROLE"; name=AWS_PROD_CLUSTER_ROLE_ARN
          else role="$DEV_ROLE"; name=AWS_DEV_CLUSTER_ROLE_ARN; fi
          [ -n "$role" ] || { echo "::error::infra 레포 Actions 비밀 ${name}이 없다 (README 4-12)"; exit 1; }
          case "$role" in
            *":role/freshlink-${TARGET_ENV}-cluster-actions") ;;
            *) echo "::error::${name}이 freshlink-${TARGET_ENV}-cluster-actions Role이 아니다"; exit 1 ;;
          esac
          echo "arn=${role}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.what.outputs.action != 'skip'

      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.what.outputs.action != 'skip'
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: hashicorp/setup-terraform@v4
        if: steps.what.outputs.action != 'skip'
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: terraform init
        if: steps.what.outputs.action != 'skip'
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          # global/tfstate.tf와 같은 규칙: freshlink-tfstate-<계정 ID 끝 4자리>
          echo "bucket = \"freshlink-tfstate-${account:8:4}\"" > backend.hcl
          echo "TF_BUCKET=freshlink-tfstate-${account:8:4}" >> "$GITHUB_ENV"
          terraform -chdir=$ROOT init -input=false -backend-config=../../../backend.hcl

      - name: 클러스터가 있는지
        id: cluster
        if: steps.what.outputs.action != 'skip'
        run: |
          if aws eks describe-cluster --name "$CLUSTER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------- unlock
      # 작업이 terraform 도중 취소·강제 종료되면 S3 잠금 파일이 남아 다음 작업이 모두
      # "Error acquiring the state lock"으로 멈춘다. concurrency로 이 워크플로는 한 번에 하나만 돌므로
      # 여기서 보이는 잠금은 끊긴 작업이나 PC에서 건 것이다. 잘못 풀지 않게 로그의 잠금 ID를 받아 맞춰 본다.
      - name: 남은 잠금 풀기
        if: steps.what.outputs.action == 'unlock'
        env:
          LOCK_ID: ${{ inputs.lock_id }}
        run: |
          if ! lock=$(aws s3 cp "s3://${TF_BUCKET}/${STATE_KEY}.tflock" - 2>/dev/null); then
            echo "잠금 없음" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$lock" | jq .
          if [ "$(echo "$lock" | jq -r .ID)" != "$LOCK_ID" ]; then
            echo "::error::lock_id가 지금 잠금 ID와 다르다. 위 내용을 보고 다시 넣는다"
            exit 1
          fi
          terraform -chdir=$ROOT force-unlock -force "$LOCK_ID"
          echo "잠금 ${LOCK_ID}를 풀었다" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- create
      # prod RDS·접속용 인스턴스는 켜는 일정이 없다. 클러스터를 만드는 동안(15~20분) 같이 켠다.
      # dev는 EventBridge가 평일 09:00에 켠다.
      - name: prod RDS·접속용 인스턴스 켜기
        if: steps.what.outputs.action == 'create' && env.TARGET_ENV == 'prod'
        run: |
          state=$(aws rds describe-db-instances --db-instance-identifier freshlink-prod-mysql \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "RDS ${state}"
          if [ "$state" = stopped ]; then
            aws rds start-db-instance --db-instance-identifier freshlink-prod-mysql >/dev/null
          fi
          id=$(aws ssm get-parameter --name /freshlink/prod/ssm-access-instance-id --query Parameter.Value --output text)
          aws ec2 start-instances --instance-ids "$id" >/dev/null
          echo "prod RDS(${state} → 켜기)·접속용 인스턴스 ${id} 켜기 요청" >> "$GITHUB_STEP_SUMMARY"

      - name: 클러스터 만들기
        if: steps.what.outputs.action == 'create'
        run: terraform -chdir=$ROOT apply -input=false -auto-approve -var nat_enabled=true

      - name: 노드 2대로 맞추기
        if: steps.what.outputs.action == 'create'
        run: |
          # 이미 있던 클러스터는 desired가 0일 수 있다(Terraform은 desired를 무시한다)
          desired=$(aws eks describe-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP" \
            --query nodegroup.scalingConfig.desiredSize --output text)
          if [ "$desired" -lt 2 ]; then
            aws eks update-nodegroup-config --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP" \
              --scaling-config desiredSize=2
            aws eks wait nodegroup-active --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP"
          fi

      - name: ArgoCD가 떴는지
        if: steps.what.outputs.action == 'create'
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl -n argocd rollout status deploy/argocd-server --timeout=10m
          kubectl get nodes
          kubectl -n argocd get pods
          echo "ArgoCD 준비됨" >> "$GITHUB_STEP_SUMMARY"

      # 클러스터를 새로 만들면 gateway ALB 주소가 바뀐다. 프론트 CloudFront의 /api/* 오리진을 새 주소로 맞춘다(할 일 13).
      # 클러스터를 PC에서 직접 apply했을 때는 수동 버튼 api-origin으로 이 단계만 돌린다.
      - name: CloudFront /api 오리진 맞추기
        if: steps.what.outputs.action == 'create' || (steps.what.outputs.action == 'api-origin' && steps.cluster.outputs.exists == 'true')
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          scripts/sync-api-origin.sh "$TARGET_ENV" | tee -a "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------- NAT
      - name: NAT 만들기·지우기
        if: steps.what.outputs.action == 'nat-on' || steps.what.outputs.action == 'nat-off'
        env:
          ACTION: ${{ steps.what.outputs.action }}
          EXISTS: ${{ steps.cluster.outputs.exists }}
        run: |
          # 클러스터가 없으면(주말) 아무것도 하지 않는다. 여기서 apply하면 클러스터 전체가 생긴다.
          if [ "$EXISTS" != "true" ]; then
            echo "클러스터가 없어 건너뛴다" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          enabled=true; [ "$ACTION" = "nat-off" ] && enabled=false
          # NAT 세 개만 건드린다. 전체 apply는 destroy가 중간에 끊겨 반쯤 남은 클러스터를 통째로 되살린다.
          terraform -chdir=$ROOT apply -input=false -auto-approve -var nat_enabled=$enabled \
            -target=aws_eip.nat -target=aws_nat_gateway.this -target=aws_route.app_nat

      # ---------------------------------------------------------------- destroy
      - name: 지우기 전 정리 (ALB·EBS)
        if: steps.what.outputs.action == 'destroy' && steps.cluster.outputs.exists == 'true'
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"

          # 앞선 destroy가 중간에 끊겼으면 access entry가 이미 지워져 kubectl이 들어가지 못한다.
          # Helm(컨트롤러)은 module.eks보다 먼저 지워지므로 이때 클러스터 안에서 정리할 수 있는 것은 없다.
          # 건너뛰고 남은 ALB·EBS는 '남은 리소스 확인'에 맡긴다.
          if ! kubectl get namespace kube-system >/dev/null 2>&1; then
            echo "::warning::kubectl로 클러스터에 들어가지 못한다(앞선 destroy가 access entry까지 지웠다). 정리를 건너뛴다"
            exit 0
          fi

          # ArgoCD가 Ingress·PVC를 다시 만들지 않게 먼저 멈춘다.
          kubectl -n argocd scale statefulset argocd-application-controller --replicas=0 || true

          # ExternalSecret에는 ESO가 떼는 finalizer가 붙는다. destroy가 ESO를 먼저 지우면 ExternalSecret이
          # 삭제 중으로 남아 external-secrets Helm 삭제가 끝나지 않는다. 클러스터를 통째로 지우므로 finalizer를 떼고 지운다.
          if kubectl get crd externalsecrets.external-secrets.io >/dev/null 2>&1; then
            kubectl get externalsecrets -A -o jsonpath='{range .items[*]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' \
              | while read -r ns name; do
                  [ -n "$ns" ] || continue
                  # 이미 삭제 중이던 것은 finalizer를 떼는 순간 사라지므로 없다는 응답은 넘어간다.
                  kubectl -n "$ns" patch externalsecret "$name" --type=merge -p '{"metadata":{"finalizers":null}}' || true
                  kubectl -n "$ns" delete externalsecret "$name" --wait=false --ignore-not-found
                done
            echo "남은 ExternalSecret $(kubectl get externalsecrets -A --no-headers 2>/dev/null | wc -l)"
          fi

          ingresses=$(kubectl get ingress -A -o name | wc -l)
          lb_svcs=$(kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' | grep -c . || true)
          pvcs=$(kubectl get pvc -A -o name | wc -l)
          echo "Ingress ${ingresses}, LoadBalancer Service ${lb_svcs}, PVC ${pvcs}"
          if [ $((ingresses + lb_svcs + pvcs)) -eq 0 ]; then
            echo "정리할 것 없음"
            exit 0
          fi

          # ALB·EBS는 클러스터 안의 컨트롤러가 지운다. 컨트롤러가 돌려면 노드(와 이미지 받을 NAT)가 있어야 한다.
          if [ "$(terraform -chdir=$ROOT output -raw nat_enabled)" != "true" ]; then
            terraform -chdir=$ROOT apply -input=false -auto-approve -var nat_enabled=true \
              -target=aws_eip.nat -target=aws_nat_gateway.this -target=aws_route.app_nat
          fi
          desired=$(aws eks describe-nodegroup --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP" \
            --query nodegroup.scalingConfig.desiredSize --output text)
          if [ "$desired" -lt 2 ]; then
            aws eks update-nodegroup-config --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP" \
              --scaling-config desiredSize=2
            aws eks wait nodegroup-active --cluster-name "$CLUSTER" --nodegroup-name "$NODEGROUP"
            for i in $(seq 1 60); do
              [ "$(kubectl get nodes --no-headers 2>/dev/null | grep -c ' Ready ')" -ge 1 ] && break
              sleep 10
            done
            kubectl -n kube-system rollout status deploy/aws-load-balancer-controller --timeout=10m
            kubectl -n kube-system rollout status deploy/ebs-csi-controller --timeout=10m
          fi

          kubectl delete ingress -A --all --timeout=5m
          kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace} {.metadata.name}{"\n"}{end}' \
            | while read -r ns name; do [ -n "$ns" ] && kubectl -n "$ns" delete svc "$name" --timeout=5m; done
          # PVC를 쓰는 파드가 살아 있으면 PVC가 지워지지 않는다. Prometheus(관측성, 할 일 16)는 Operator가
          # StatefulSet을 되살리므로 Prometheus 리소스부터 지워 파드를 내린다.
          if kubectl get crd prometheuses.monitoring.coreos.com >/dev/null 2>&1; then
            kubectl delete prometheus -A --all --timeout=5m
          fi
          kubectl delete pvc -A --all --timeout=5m

          # 컨트롤러가 ALB와 EBS를 실제로 지울 때까지 기다린다(최대 10분)
          for i in $(seq 1 60); do
            albs=$(aws resourcegroupstaggingapi get-resources --resource-type-filters elasticloadbalancing:loadbalancer \
              --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$CLUSTER" --query 'length(ResourceTagMappingList)' --output text)
            pvs=$(kubectl get pv --no-headers 2>/dev/null | wc -l)
            echo "남은 ALB ${albs}, PV ${pvs}"
            [ "$albs" -eq 0 ] && [ "$pvs" -eq 0 ] && break
            sleep 10
          done

      - name: 클러스터 지우기
        if: steps.what.outputs.action == 'destroy'
        run: terraform -chdir=$ROOT destroy -input=false -auto-approve

      - name: 남은 리소스 확인
        if: steps.what.outputs.action == 'destroy'
        run: |
          set -uo pipefail
          vpc=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=freshlink-${TARGET_ENV}-vpc" --query 'Vpcs[0].VpcId' --output text)
          # destroy 직후에는 EKS·NAT가 쓰던 ENI가 아직 정리 중일 수 있다. 최대 10분 동안 30초마다 다시 본다.
          # RDS ENI는 RDS가 꺼져 있으면 available로 보이므로 세지 않는다(지우면 안 된다).
          for i in $(seq 1 20); do
            albs=$(aws resourcegroupstaggingapi get-resources --tag-filters "Key=elbv2.k8s.aws/cluster,Values=$CLUSTER" \
              --query 'ResourceTagMappingList[].ResourceARN' --output text)
            sgs=$(aws ec2 describe-security-groups --filters "Name=tag:elbv2.k8s.aws/cluster,Values=$CLUSTER" \
              --query 'SecurityGroups[].GroupId' --output text)
            vols=$(aws ec2 describe-volumes --filters Name=status,Values=available Name=tag-key,Values=CSIVolumeName \
              --query 'Volumes[].VolumeId' --output text)
            enis=$(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$vpc" Name=status,Values=available \
              --query "NetworkInterfaces[?Description!='RDSNetworkInterface'].[NetworkInterfaceId,Description]" \
              --output text | tr '\t\n' ' ;')
            nats=$(aws ec2 describe-nat-gateways --filter "Name=vpc-id,Values=$vpc" Name=state,Values=pending,available \
              --query 'NatGateways[].NatGatewayId' --output text)
            [ -z "${albs}${sgs}${vols}${enis}${nats}" ] && break
            echo "[$i/20] 남은 것: ALB=${albs:-없음} SG=${sgs:-없음} EBS=${vols:-없음} ENI=${enis:-없음} NAT=${nats:-없음}"
            sleep 30
          done
          table=$(
            echo "| 종류 | 남은 것 |"
            echo "| --- | --- |"
            echo "| ALB·대상 그룹 | ${albs:-없음} |"
            echo "| LB 보안 그룹 | ${sgs:-없음} |"
            echo "| EBS 볼륨 | ${vols:-없음} |"
            echo "| ENI | ${enis:-없음} |"
            echo "| NAT | ${nats:-없음} |"
          )
          echo "$table"
          echo "$table" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${albs}${sgs}${vols}${enis}${nats}" ]; then
            echo "::error::클러스터를 지우고 10분이 지나도 남은 리소스가 있다. 요약 표를 스레드에 붙여 넣는다"
            exit 1
          fi
          echo "남은 리소스 없음"

      # prod는 클러스터를 지우면 RDS·접속용 인스턴스도 끈다(EventBridge 21:00·23:00 끄기보다 먼저).
      - name: prod RDS·접속용 인스턴스 끄기
        if: steps.what.outputs.action == 'destroy' && env.TARGET_ENV == 'prod'
        run: |
          state=$(aws rds describe-db-instances --db-instance-identifier freshlink-prod-mysql \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "RDS ${state}"
          # 켜는 중(starting)에는 끌 수 없다. 그때는 EventBridge 21:00·23:00 끄기에 맡긴다
          if [ "$state" = available ]; then
            aws rds stop-db-instance --db-instance-identifier freshlink-prod-mysql >/dev/null
          fi
          id=$(aws ssm get-parameter --name /freshlink/prod/ssm-access-instance-id --query Parameter.Value --output text)
          aws ec2 stop-instances --instance-ids "$id" >/dev/null
          echo "prod RDS(${state})·접속용 인스턴스 ${id} 끄기 요청" >> "$GITHUB_STEP_SUMMARY"

      # 취소·시간 초과로 terraform이 강제 종료되면 잠금 파일이 남는다. 이 러너가 건 잠금이면 바로 푼다.
      # 다른 곳(PC, 다른 작업)이 건 잠금은 건드리지 않는다.
      - name: 끊긴 작업의 잠금 풀기
        if: cancelled() || failure()
        run: |
          lock=$(aws s3 cp "s3://${TF_BUCKET}/${STATE_KEY}.tflock" - 2>/dev/null) || exit 0
          if [ "$(echo "$lock" | jq -r .Who)" = "$(whoami)@$(hostname)" ]; then
            terraform -chdir=$ROOT force-unlock -force "$(echo "$lock" | jq -r .ID)"
            echo "이 작업이 남긴 state 잠금을 풀었다" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
