# prod 클러스터 켜고 끄기 입구 (할 일 14). 하는 일은 dev-cluster.yml과 같고 env=prod로 부를 뿐이다.
# EventBridge(envs/prod/persistent, modules/workflow-dispatch)가 매일 21:05·23:05 destroy로 부른다.
# 그 Lambda는 action 하나만 넘길 수 있어서 env를 정해 둔 입구를 따로 둔다.
# 사람이 켜고 끌 때는 dev-cluster에서 env=prod를 골라도 되고 여기서 해도 된다(같은 줄에 선다).
name: prod-cluster

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create = prod 클러스터 만들기(RDS·NAT·노드 2대 포함), destroy = 지우기(RDS도 끔), nat-on / nat-off, api-origin, unlock"
        type: choice
        required: true
        options: [create, destroy, nat-on, nat-off, api-origin, unlock]
      lock_id:
        description: "unlock일 때만: 실패한 작업 로그 'Lock Info'의 ID"
        type: string
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  prod:
    uses: ./.github/workflows/dev-cluster.yml
    with:
      action: ${{ inputs.action }}
      env: prod
      lock_id: ${{ inputs.lock_id }}
    secrets: inherit
